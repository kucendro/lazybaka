name: publish

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/publish.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: build
        run: mdbook build docs

      - name: no-dead-links
        run: |
          if grep -rnoE '\]\([a-z0-9-]+\.md[^)]*\)' docs/src --include='*.md' \
            | sed -E 's/.*\]\(([a-z0-9-]+\.md).*/\1/' \
            | sort -u \
            | while read -r page; do [ -f "docs/src/$page" ] || echo "$page"; done \
            | grep .; then
            echo "the pages above are linked from docs/src but do not exist" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
