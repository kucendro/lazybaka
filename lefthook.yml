pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    - name: nixfmt
      glob: "*.nix"
      run: nixfmt {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: fmt
      run: cargo fmt --all --check
    - name: clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: test
      run: cargo test
    - name: no-real-host
      run: |
        if git grep -nIE '//bakalari\.[a-z0-9-]+\.[a-z]{2,}' -- . | grep -v example; then
          echo "a real Bakalari host is committed, keep it in .env.local instead" >&2
          exit 1
        fi
