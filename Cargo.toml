[package]
name = "bakasync"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "One-way sync from a public Bakalari timetable to a dedicated Google Calendar"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
dotenvy = "0.15"
hex = "0.4"
humantime = "2"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
